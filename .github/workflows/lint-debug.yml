name: lint-debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Lint markdown
        run: |
          git clone --quiet --depth 1 --branch agent/analyze-checkpoint https://github.com/tmusser/ai-engineering-skills.git repo
          cd repo
          npx markdownlint-cli2 "**/*.md"
