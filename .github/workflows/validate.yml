name: validate

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile validator
        run: python -m py_compile scripts/validate_repo.py

      - name: Compile Claude Code installer
        run: python -m py_compile scripts/install_claude_code.py

      - name: Compile Codex installer
        run: python -m py_compile scripts/install_codex.py

      - name: Compile behavioral CI scripts
        run: |
          python -m py_compile scripts/install_common.py
          python -m py_compile scripts/run_runnable_examples.py
          python -m py_compile scripts/run_negative_examples.py
          python -m py_compile scripts/render_github_step_summary.py
          python -m py_compile scripts/check_contract_lineage.py
          python -m py_compile tests/test_installers.py

      - name: Validate repo structure
        run: python scripts/validate_repo.py

      - name: Run installer and example behavior tests
        run: python -m unittest discover tests

      - name: Run runnable example suites
        run: python scripts/run_runnable_examples.py

      - name: Run negative example suites
        run: python scripts/run_negative_examples.py

      - name: Run Claude Code dry-run smoke check
        run: |
          tmp_home="$(mktemp -d)"
          HOME="$tmp_home" python scripts/install_claude_code.py --target user --dry-run
          test ! -e "$tmp_home/.claude/skills"

      - name: Run Codex dry-run smoke check
        run: |
          tmp_home="$(mktemp -d)"
          HOME="$tmp_home" python scripts/install_codex.py --target user --dry-run
          test ! -e "$tmp_home/.agents/skills"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint markdown
        run: npx markdownlint-cli2@0.22.1 "**/*.md"

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --config .lychee.toml
            README.md
            docs/**/*.md
            skills/**/*.md
            templates/**/*.md
            examples/**/*.md

      - name: Check install wrapper help
        run: bash install.sh --help
