name: validate

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile validator
        run: python -m py_compile scripts/validate_repo.py

      - name: Compile Claude Code installer
        run: python -m py_compile scripts/install_claude_code.py

      - name: Compile Codex installer
        run: python -m py_compile scripts/install_codex.py

      - name: Validate repo structure
        run: python scripts/validate_repo.py

      - name: Run Claude Code dry-run smoke check
        run: |
          tmp_home="$(mktemp -d)"
          HOME="$tmp_home" python scripts/install_claude_code.py --target user --dry-run
          test ! -e "$tmp_home/.claude/skills"

      - name: Run Codex dry-run smoke check
        run: |
          tmp_home="$(mktemp -d)"
          HOME="$tmp_home" python scripts/install_codex.py --target user --dry-run
          test ! -e "$tmp_home/.agents/skills"

      - name: Run tiny bugfix passing example
        run: python -m unittest discover examples/tiny-bugfix/after

      - name: Check install wrapper help
        run: bash install.sh --help
