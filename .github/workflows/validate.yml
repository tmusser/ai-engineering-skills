name: validate

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile validator
        run: python -m py_compile scripts/validate_repo.py

      - name: Compile Claude Code installer
        run: python -m py_compile scripts/install_claude_code.py

      - name: Validate repo structure
        run: python scripts/validate_repo.py
